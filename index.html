const ex=h=>'<span class="ex">'+h+'</span>';

function poly(ts){
  let o='';
  ts.forEach(([c,m])=>{
    if(c===0)return;
    const neg=c<0,a=abs(c);
    const num=(m!==''&&a===1)?'':ar(a);
    const body=m===''?num:(num?num+' ':'')+m;
    if(!o)o=(neg?'−':'')+body; else o+=(neg?' − ':' + ')+body;
  });
  return o||'٠';
}
const lin=(v,k)=>v+' '+(k<0?'−':'+')+' '+ar(abs(k));

const sqx=h=>ex('( '+h+' )'+sup(2));
const sg=(c,m)=>(c<0?' − ':' + ')+(m===''?ar(abs(c)):((abs(c)===1?'':ar(abs(c))+' ')+m));
const half=n=>n%2===0?ar(abs(n)/2):fr(abs(n),2);
const sqh=n=>n%2===0?ar(n*n/4):fr(n*n,4);
const vh=(v,n)=>v+' '+(n<0?'−':'+')+' '+half(n);
function parseNum(s){
  s=String(s).replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[−–]/g,'-').replace(/÷/g,'/').replace(/٫/g,'.').replace(/\s/g,'');
  if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const p=s.split('/');return +p[0]/+p[1];}

const H=(s)=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);

  return String(4294967296*(2097151&h2)+(h1>>>0));};

/* ---------- icons & contact ---------- */

 phone:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.6 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.6 3.6a1 1 0 01-.25 1z"/></svg>',

/* ---------- explanation generators ---------- */
function gIdentify(){
  const v=pick(VARS),m=R(1,4),n=R(2,9),s=pick([1,-1]);
  const kind=pick(['ok','ok','mid','last','neg']);
  let A=m*m,B=2*m*n,C=n*n;
  if(kind==='mid')B+=pick([-2,2,3]);
  if(kind==='last')C+=pick([1,2,3]);
  if(kind==='neg')C=-C;
  B*=s;
  const rv=poly([[m,v]]);
  const st=[];let fin;
  st.push('الحد الأول '+ex(poly([[A,pw(v,2)]]))+' مربّع كامل، وجذره التربيعي الموجب = '+ex(rv));
  if(C<0){
    st.push('الحد الأخير '+ex(poly([[C,'']]))+' سالب، والمربّع الكامل لا يكون سالبًا.');
    fin='∴ الحدودية ليست مربّعًا كاملًا';
  }else if(!isq(C)){
    st.push('الحد الأخير '+ex(ar(C))+' ليس مربّعًا كاملًا.');
    fin='∴ الحدودية ليست مربّعًا كاملًا';
  }else{
    const rC=Math.sqrt(C),mid=2*m*rC;
    st.push('الحد الأخير '+ex(ar(C))+' مربّع كامل، وجذره التربيعي الموجب = '+ex(ar(rC)));

    st.push('ضعف حاصل الضرب: '+ex('٢ × '+rv+' × '+ar(rC)+' = '+poly([[mid,v]]))+' ، والحد الأوسط في الحدودية '+ex(poly([[abs(B),v]]))+(same?' ← يتساويان، والإشارة هي إشارة الحد الأوسط':' ← لا يتساويان'));

}

    return{tag:'مثال ٢',title:'التحليل مع العامل المشترك',ask:'حلّل تحليلًا تامًّا. تذكّر: أخرِج العامل المشترك الأكبر أولًا.',problem:ex(P),
      steps:['العامل المشترك الأكبر = '+ex(ar(k))+' ، فنخرجه: '+ex(ar(k)+' ( '+tri+' )'),
        'الحدودية داخل القوس: جذر الحد الأول '+ex(poly([[a,v]]))+' ، وجذر الحد الأخير '+ex(ar(b))+' ، وضعف الحاصل '+ex('٢ × '+poly([[a,v]])+' × '+ar(b)+' = '+poly([[2*a*b,v]]))+' يساوي الحد الأوسط، إذن هي مربّع كامل',
        'نحلّلها: '+ex(ar(k)+' ( '+inner+' )'+sup(2))],
      final:'∴ '+ex(ar(k)+' ( '+inner+' )'+sup(2))};
  }
  const [v,w]=pick(PAIRS),a=R(1,3),b=R(1,4);
  const P=poly([[a*a,pw(v,3)],[s*2*a*b,pw(v,2)+' '+w],[b*b,v+' '+pw(w,2)]]);
  const tri=poly([[a*a,pw(v,2)],[s*2*a*b,v+' '+w],[b*b,pw(w,2)]]);
  const inner=poly([[a,v],[s*b,w]]);
  return{tag:'مثال ٢',title:'التحليل مع العامل المشترك',ask:'حلّل تحليلًا تامًّا. تذكّر: أخرِج العامل المشترك الأكبر أولًا.',problem:ex(P),
    steps:['العامل المشترك الأكبر = '+ex(v)+' ، فنخرجه: '+ex(v+' ( '+tri+' )'),
      'الحدودية داخل القوس: جذر الحد الأول '+ex(poly([[a,v]]))+' ، وجذر الحد الأخير '+ex(poly([[b,w]]))+' ، وضعف الحاصل '+ex('٢ × '+poly([[a,v]])+' × '+poly([[b,w]])+' = '+poly([[2*a*b,v+' '+w]]))+' يساوي الحد الأوسط، إذن هي مربّع كامل',
      'نحلّلها: '+ex(v+' ( '+inner+' )'+sup(2))],
    final:'∴ '+ex(v+' ( '+inner+' )'+sup(2))};
}
function gFindC(){
  const [v,w]=pick(PAIRS);let a=R(1,5),b=R(2,9);while(a===b)b=R(2,9);
  const P=ex((a*a>1?ar(a*a)+' ':'')+pw(v,2)+' + جـ '+v+' '+w+' + '+ar(b*b)+' '+pw(w,2));
  const ra=poly([[a,v]]),rb=poly([[b,w]]);
  return{tag:'مثال ٣',title:'أوجد قيمة جـ',ask:'أوجد قيمة جـ التي تجعل الحدودية الثلاثية الآتية مربّعًا كاملًا.',problem:P,
    steps:['الجذر التربيعي الموجب للحد الأول = '+ex(ra),'الجذر التربيعي الموجب للحد الثالث = '+ex(rb),
      'الحد الأوسط = '+ex('± ٢ × '+ra+' × '+rb),
      ex('جـ '+v+' '+w+' = ± '+ar(2*a*b)+' '+v+' '+w)],
    final:'∴ جـ = '+ar(2*a*b)+' أو جـ = −'+ar(2*a*b),
    check:{label:'اكتب إحدى القيمتين:',ok:x=>abs(x)===2*a*b,ans:'جـ = ± '+ar(2*a*b)}};
}
function gNumeric(){
  const base=pick([10,20,30,40,50,60,100,200]),d=R(1,3),s=pick([1,-1]),n=base+s*d,sy=s>0?'+':'−';
  const t1=base*base,t2=2*base*d,t3=d*d;
  return{tag:'دورك الآن',title:'استخدم المربّع الكامل في الحساب',ask:'أوجد القيمة دون استخدام الآلة الحاسبة، بتوظيف مفهوم المربّع الكامل.',problem:ex('( '+ar(n)+' )'+sup(2)),
    steps:['نكتب العدد على صورة مجموع أو فرق: '+ex('( '+ar(n)+' )'+sup(2)+' = ( '+ar(base)+' '+sy+' '+ar(d)+' )'+sup(2)),
      'نطبّق القانون: '+ex('= ( '+ar(base)+' )'+sup(2)+' '+sy+' ٢ × '+ar(base)+' × '+ar(d)+' + ( '+ar(d)+' )'+sup(2)),
      'نحسب كل حد: '+ex('= '+ar(t1)+' '+sy+' '+ar(t2)+' + '+ar(t3))],
    final:'∴ '+ex('( '+ar(n)+' )'+sup(2)+' = '+ar(n*n)),
    check:{label:'اكتب الناتج:',ok:x=>x===n*n,ans:ar(n*n)}};
}
function gComplete(){
  const v=pick(VARS);const b=R(2,16)*pick([1,-1]);const hn=(b<0?'−':'')+half(b);
  const P=ex(poly([[1,pw(v,2)],[b,v]]));
  return{tag:'مثال ٤',title:'إكمال المربّع',ask:'أكمل الحدودية الآتية إلى مربّع كامل.',problem:P,
    steps:['معامل '+v+' = '+ex((b<0?'−':'')+ar(abs(b))),'نصف معامل '+v+' = '+ex(ar(b)+' ÷ ٢ = '+hn),
      'مربّع نصف المعامل = '+ex('( '+hn+' )'+sup(2)+' = '+sqh(b)),
      'نضيف هذا العدد: '+ex(pw(v,2)+sg(b,v)+' + '+sqh(b)+' = ( '+vh(v,b)+' )'+sup(2))],
    final:'∴ نضيف '+ex(sqh(b))+' فتصبح '+sqx(vh(v,b)),
    check:{label:'ما العدد المضاف؟ (يمكن كتابة كسر مثل ٢٥/٤)',ok:x=>abs(x-b*b/4)<1e-9,ans:b*b/4}};
}
function gFactorCS(){
  const v=pick(VARS);let p,q;
  do{p=R(-8,8);q=R(-8,8);}while(!p||!q||p===q||p+q===0);
  if(p>q){const t=p;p=q;q=t;}
  const k=pick([1,1,2,3]);const b=-(p+q),c=p*q,dd=q-p,v2=pw(v,2);
  const tri=poly([[1,v2],[b,v],[c,'']]);
  const P=poly([[k,v2],[k*b,v],[k*c,'']]);
  const ds=dd%2===0?ar(dd/2):fr(dd,2);
  const dsq=dd%2===0?ar(dd*dd/4):fr(dd*dd,4);
  const hn=(b<0?'−':'')+half(b);
  const st=[];
  if(k>1)st.push('نخرج العامل المشترك '+ex(ar(k))+' : '+ex(ar(k)+' ( '+tri+' )'));
  st.push('الحدودية '+ex(tri)+' ليست مربّعًا كاملًا، لذلك نكمّلها إلى مربّع كامل');
  st.push('نصف معامل '+v+' = '+ex(hn)+' ، ومربّعه = '+ex(sqh(b)));
  st.push('نضيف مربّع نصف المعامل ونطرحه حتى لا تتغيّر الحدودية: '+ex(v2+sg(b,v)+' + '+sqh(b)+' − '+sqh(b)+sg(c,'')));
  st.push('نجمع الأعداد: '+ex(sqh(b)+' − '+(c<0?'( −'+ar(-c)+' )':ar(c))+' = '+dsq)+' ، فتصبح الحدودية '+ex('( '+vh(v,b)+' )'+sup(2)+' − ( '+ds+' )'+sup(2))+' وهي فرق بين مربعين');
  st.push('نحلّل الفرق بين مربعين: '+ex('( '+vh(v,b)+' − '+ds+' ) ( '+vh(v,b)+' + '+ds+' )'));
  st.push('نبسّط كل قوس: '+ex((k>1?ar(k)+' ':'')+'( '+lin(v,-q)+' ) ( '+lin(v,-p)+' )'));
  return{tag:'مثال ٥',title:'التحليل بإكمال المربّع',ask:'حلّل الحدودية الآتية بطريقة إكمال المربّع.',problem:ex(P),steps:st,
    final:'∴ '+ex((k>1?ar(k)+' ':'')+'( '+lin(v,-q)+' ) ( '+lin(v,-p)+' )')};
}
const EXPL=[null,gIdentify,gGCF,gFindC,gNumeric,gComplete,gFactorCS];

/* ---------- quiz generators ---------- */
function opts(correct,list){
  const seen=new Set([correct]),out=[];
  for(const d of list){if(d&&!seen.has(d)){seen.add(d);out.push(d);if(out.length===3)break;}}
  let z=0;while(out.length<3){out.push('لا شيء مما سبق ('+ar(++z)+')');}
  const all=shuffle([correct].concat(out));
  return{o:all,a:all.indexOf(correct)};
}
const mk=(q,poly_,correct,list)=>{const r=opts(correct,list);return{q:q,p:poly_||'',o:r.o,a:r.a};};
const qIdentify=()=>{
  const v=pick(VARS),m=R(1,4),n=R(2,9),s=pick([1,-1]);
  const f=(A,B,C)=>ex(poly([[A,pw(v,2)],[B,v],[C,'']]));
  const A=m*m,B=2*m*n,C=n*n;
  return mk('أيّ الحدوديات الثلاثية الآتية تمثّل مربّعًا كاملًا؟','',f(A,s*B,C),
    [f(A,s*(B+2),C),f(A,s*B,C+pick([1,2,3])),f(A,s*B,-C),f(A,s*(B-2),C)]);
};
const qFactor=()=>{
  const v=pick(VARS),a=R(2,5),b=R(2,9),s=pick([1,-1]);
  const P=ex(poly([[a*a,pw(v,2)],[s*2*a*b,v],[b*b,'']]));
  return mk('حلّل الحدودية الآتية تحليلًا تامًّا:',P,sqx(bn(a,v,s*b)),
    [sqx(bn(a,v,-s*b)),sqx(bn(a*a,v,s*b)),ex('( '+bn(a,v,b)+' ) ( '+bn(a,v,-b)+' )'),sqx(bn(a,v,s*(b+1)))]);
};
const qGcf=()=>{
  const v=pick(VARS),k=R(2,5),a=R(1,3),b=R(1,7),s=pick([1,-1]);
  const P=ex(poly([[k*a*a,pw(v,2)],[s*2*k*a*b,v],[k*b*b,'']]));
  const kk=i=>ex(ar(k)+' ( '+i+' )'+sup(2));
  return mk('حلّل الحدودية الآتية تحليلًا تامًّا:',P,kk(bn(a,v,s*b)),
    [kk(bn(a,v,-s*b)),kk(bn(a*a,v,s*b)),kk(bn(a,v,s*(b+1))),sqx(bn(k*a,v,s*b))]);
};
const qFindC=()=>{
  const [v,w]=pick(PAIRS);let a=R(1,5),b=R(2,9);while(a===b)b=R(2,9);
  const P=ex((a*a>1?ar(a*a)+' ':'')+pw(v,2)+' + جـ '+v+' '+w+' + '+ar(b*b)+' '+pw(w,2));
  const t=x=>'جـ = '+x;
  return mk('ما قيمة جـ التي تجعل الحدودية الآتية مربّعًا كاملًا؟',P,t('± '+ar(2*a*b)),
    [t(ar(2*a*b)+' فقط'),t('± '+ar(a*b)),t('± '+ar(a*a+b*b)),t('± '+ar(4*a*b))]);
};
const qNumeric=()=>{
  const base=pick([10,20,30,40,50,60,100,200]),d=R(1,3),s=pick([1,-1]),n=base+s*d;
  return mk('بتوظيف مفهوم المربّع الكامل، ما قيمة ما يلي؟',ex('( '+ar(n)+' )'+sup(2)),ar(n*n),
    [ar(base*base+d*d),ar((base-s*d)*(base-s*d)),ar(base*base+s*2*base*d),ar(n*n+2*d)].filter(x=>x!==ar(n*n)));
};

    [ar(abs(b)/2),ar(b*b),ar(2*abs(b)),'−'+ar(b*b/4)]);
};
const qCompleteOdd=()=>{

    [fr(abs(b),2),ar(b*b),fr(b*b,2),fr(abs(b),4)]);
};
const qFactorCS=()=>{
  const v=pick(VARS);let p,q;
  do{p=R(-9,9);q=R(-9,9);}while(!p||!q||p===q||p+q===0);
  const f=(x,y)=>ex('( '+lin(v,-x)+' ) ( '+lin(v,-y)+' )');
  return mk('حلّل الحدودية الآتية بطريقة إكمال المربّع:',ex(poly([[1,pw(v,2)],[-(p+q),v],[p*q,'']])),f(p,q),[f(-p,-q),f(p,-q),f(-p,q)]);

const qSide=()=>{
  const v=pick(VARS),a=R(2,4),b=R(2,9),s=1;
  return mk('مربّع مساحته الحدودية الآتية (وحدة مربّعة). ما طول ضلعه؟',ex(poly([[a*a,pw(v,2)],[2*a*b,v],[b*b,'']])),ex(bn(a,v,b)),
    [ex(bn(a,v,-b)),ex(bn(a*a,v,b)),ex(bn(a,v,2*b)),ex(bn(a,v,b*b))]);
};
const q2Var=()=>{
  const [v,w]=pick(PAIRS);let a=R(1,4),b=R(2,5);while(a===b)b=R(2,5);const s=pick([1,-1]);
  const P=ex(poly([[a*a,pw(v,2)],[s*2*a*b,v+' '+w],[b*b,pw(w,2)]]));
  const f=(x,y)=>sqx(poly([[x,v],[y,w]]));
  return mk('حلّل الحدودية الآتية تحليلًا تامًّا:',P,f(a,s*b),
    [f(a,-s*b),f(b,s*a),ex('( '+poly([[a,v],[b,w]])+' ) ( '+poly([[a,v],[-b,w]])+' )'),f(a,s*2*b)]);
};
const QGENS=[qIdentify,qFactor,qGcf,qFindC,qNumeric,qCompleteEven,qCompleteOdd,qFactorCS,qSide,q2Var];

   '<section class="card pass"><h2>'+IC.lock+'كلمة السر</h2><p class="ask" style="margin:6px 0 0">أدخل كلمة السر التي أعطتها لك المعلمة للدخول إلى الشرح والاختبار.</p>'+
   '<form id="gateForm"><div class="field"><label for="pw">كلمة السر</label><input class="inp" id="pw" type="password" autocomplete="off" style="direction:ltr;text-align:center"></div>'+
   '<div class="ctrl"><button class="btn" type="submit">دخول</button></div><div class="msg '+S.msgCls+'" id="gmsg" role="status">'+S.msg+'</div></form>'+
   '<div class="teacher" id="tBox" '+(S.canEdit?'':'hidden')+'><button class="btn ghost sm" data-act="teacher">إعدادات المعلمة</button>'+(S.showTeacher?teacherForm():'')+'</div></section></div>';
  return h;
}
function hubView(){
  return chrome(heroHTML()+'<div class="hub"><button data-act="go" data-v="explain"><strong>شرح تفاعلي</strong><span>أمثلة محلولة خطوة بخطوة، وفي كل مرة بأرقام جديدة.</span></button>'+
   '<button data-act="go" data-v="quiz"><strong>الاختبار</strong><span>١٠ أسئلة بأرقام مختلفة في كل محاولة. اكتب اسمك قبل أن تبدأ.</span></button></div>');
}
function quizView(){
  const Q=quiz;let h='';
  if(Q.stage==='name'){
    h='<div class="qwrap">'+contact()+'<div class="card"><h2>الاختبار</h2><p class="ask">١٠ أسئلة اختيار من متعدد، وأرقامها تتغيّر في كل محاولة.</p>'+
     '<div class="field"><label for="stName">اسم الطالب <span style="color:var(--bad)">(إجباري)</span></label><input class="inp" id="stName" autocomplete="off" value="'+Q.name.replace(/"/g,'&quot;')+'" placeholder="اكتب اسمك الكامل"></div>'+
     '<div class="ctrl"><button class="btn" id="goName" data-act="toConfirm" '+(Q.name.trim().length>=2?'':'disabled')+'>متابعة</button><span class="ask" id="nameHint">لا يمكن بدء الاختبار قبل كتابة الاسم.</span></div></div></div>';
  }else if(Q.stage==='confirm'){
    h='<div class="qwrap"><div class="card center"><h2>تأكيد الاسم</h2><p class="ask">هل هذا اسمك؟ لن تتمكن من تغييره بعد بدء الاختبار.</p><p style="font-size:1.6rem;font-weight:800;color:var(--accent);margin:8px 0">'+esc(Q.name.trim())+'</p>'+
     '<div class="ctrl" style="justify-content:center"><button class="btn" data-act="start">نعم، ابدأ الاختبار</button><button class="btn ghost" data-act="editName">تعديل الاسم</button></div></div></div>';
  }else if(Q.stage==='run'){
    const q=Q.qs[Q.idx],n=Q.qs.length,last=Q.idx===n-1;
    h='<div class="qwrap"><div class="card"><div class="ask">الطالب: '+esc(Q.name.trim())+' · السؤال '+ar(Q.idx+1)+' من '+ar(n)+'</div><div class="prog"><i style="width:'+((Q.idx+1)/n*100)+'%"></i></div>'+
     '<div class="qtext">'+q.q+'</div>'+(q.p?'<div class="qpoly">'+q.p+'</div>':'')+
     '<div class="opts">'+q.o.map((o,k)=>'<button class="opt'+(Q.ans[Q.idx]===k?' sel':'')+'" data-act="pick" data-k="'+k+'">'+o+'</button>').join('')+'</div>'+
     '<div class="ctrl" style="justify-content:space-between"><button class="btn ghost" data-act="prev" '+(Q.idx?'':'disabled')+'>السابق</button>'+
     '<button class="btn" data-act="'+(last?'finish':'next')+'" '+(Q.ans[Q.idx]===null?'disabled':'')+'>'+(last?'إنهاء الاختبار':'التالي')+'</button></div></div></div>';
  }else{
    let sc=0;Q.qs.forEach((q,i)=>{if(Q.ans[i]===q.a)sc++;});
    const pc=sc/Q.qs.length;const note=pc>=.9?'ممتاز، أحسنت!':pc>=.7?'جيد جدًا، استمر.':pc>=.5?'جيد، راجع الأخطاء وحاول مرة أخرى.':'راجع الشرح التفاعلي ثم أعد المحاولة.';
    h='<div class="qwrap"><div class="card center"><div class="ask">نتيجة الطالب</div><h2>'+esc(Q.name.trim())+'</h2><p class="score">'+ar(sc)+' / '+ar(Q.qs.length)+'</p><p style="font-weight:700;margin:0">'+note+'</p><p class="ask" style="margin:4px 0 0">'+Q.when+'</p></div>'+contact()+
     '<div class="review">'+Q.qs.map((q,i)=>{const ok=Q.ans[i]===q.a;return '<div class="ritem '+(ok?'ok':'no')+'"><span class="pill '+(ok?'ok':'no')+'">السؤال '+ar(i+1)+(ok?' · صحيح':' · خطأ')+'</span><div style="font-weight:700;margin-top:4px">'+q.q+'</div>'+(q.p?'<div class="qpoly">'+q.p+'</div>':'')+
       (ok?'<div>إجابتك: '+q.o[q.a]+'</div>':'<div>إجابتك: '+(Q.ans[i]===null?'—':q.o[Q.ans[i]])+'</div><div>الإجابة الصحيحة: '+q.o[q.a]+'</div>')+'</div>';}).join('')+'</div>'+
     '<div class="ctrl" style="justify-content:center;margin-top:16px"><button class="btn" data-act="retry">إعادة الاختبار بأرقام جديدة</button></div></div>';
  }
  return chrome(h);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const a=$('#app');
  if(!S.unlocked)S.view='gate';
  if(S.view==='gate')a.innerHTML=gateView();
  else if(S.view==='hub')a.innerHTML=hubView();
  else if(S.view==='explain')a.innerHTML=chrome(heroHTML()+explainView());
  else{if(!quiz)quiz=newQuiz();a.innerHTML=quizView();}
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,i=+t.dataset.i;
  if(act==='go'){S.view=t.dataset.v;if(S.view==='quiz'&&quiz&&quiz.stage==='run'){}S.showTeacher=false;render();}
  else if(act==='logout'){try{sessionStorage.removeItem('mq_ok');}catch(x){}S.unlocked=false;S.view='gate';S.msg='';S.showTeacher=false;quiz=null;render();}
  else if(act==='teacher'){S.showTeacher=!S.showTeacher;render();}
  else if(act==='next'){if(S.view==='quiz'){quiz.idx++;render();}else{cards[i].shown++;refresh(i);}}
  else if(act==='all'){cards[i].shown=cards[i].data.steps.length;refresh(i);}
  else if(act==='new'){newCard(i);refresh(i);}
  else if(act==='check'){
    const v=parseNum($('#chk'+i).value),m=$('#chkm'+i),c=cards[i].data.check;
    if(isNaN(v)){m.className='msg err';m.textContent='اكتب رقمًا.';}
    else if(c.ok(v)){m.className='msg ok';m.textContent='إجابة صحيحة، أحسنت!';}
    else{m.className='msg err';m.textContent='ليست صحيحة بعد، راجع الخطوات وحاول مرة أخرى.';}
  }
  else if(act==='jump'){e.preventDefault();const el=document.getElementById('sec'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(act==='toConfirm'){const n=($('#stName').value||'').trim();if(n.length<2)return;quiz.name=n;quiz.stage='confirm';render();}
  else if(act==='editName'){quiz.stage='name';render();}
  else if(act==='start'){quiz.stage='run';quiz.idx=0;render();}
  else if(act==='pick'){quiz.ans[quiz.idx]=+t.dataset.k;const y=window.scrollY;render();window.scrollTo(0,y);}
  else if(act==='next'||act==='prev'){}
  if(act==='prev'){quiz.idx--;render();}
  if(act==='finish'){let d;try{d=new Date().toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});}catch(x){d=new Date().toLocaleString();}quiz.when=d;quiz.stage='done';render();}
  if(act==='retry'){quiz=newQuiz(quiz.name);render();}
});
function refresh(i){const el=document.getElementById('sec'+i);if(el)el.innerHTML=cardHTML(i);}
document.addEventListener('input',function(e){
  if(e.target.id==='tileRange'){tileB=+e.target.value;const el=document.getElementById('sec0');el.innerHTML=tilesCard();const r=$('#tileRange');r.focus();}
  if(e.target.id==='stName'){const ok=e.target.value.trim().length>=2;const b=$('#goName');if(b)b.disabled=!ok;const h=$('#nameHint');if(h)h.textContent=ok?'':'لا يمكن بدء الاختبار قبل كتابة الاسم.';}
});
document.addEventListener('submit',async function(e){
  e.preventDefault();
  if(e.target.id==='gateForm'){
    const val=normPw($('#pw').value);
    if(H(val)===PASSHASH){S.unlocked=true;S.view='hub';S.msg='';try{sessionStorage.setItem('mq_ok',PASSHASH);}catch(x){}render();}
    else{const m=$('#gmsg');m.className='msg err';m.textContent='كلمة السر غير صحيحة، حاول مرة أخرى.';}
  }
  if(e.target.id==='pwForm'){
    const val=normPw($('#newPw').value),m=$('#tmsg');
    if(val.length<3){m.className='msg err';m.textContent='اكتب ثلاثة أحرف أو أرقام على الأقل.';return;}
    m.className='msg';m.textContent='جاري الحفظ والنشر...';
    try{
      const art=await claude.use('artifact');
      if(!art){m.className='msg err';m.textContent='تغيير كلمة السر متاح لصاحبة الصفحة عند فتحها داخل Claude.';return;}
      const clone=document.body.cloneNode(true);
      Array.prototype.slice.call(clone.children).forEach(function(el){if(!el.hasAttribute('data-page'))el.remove();});
      clone.querySelector('#app').innerHTML='';
      clone.querySelector('#cfg').textContent=JSON.stringify({h:H(val)});
      const rs=document.head.querySelector('style');
      const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+(rs?rs.textContent:'')+'</style></head><body>'+clone.innerHTML+'</body></html>';
      await art.publish(html);
      m.className='msg ok';m.textContent='تم الحفظ. تتحدّث الصفحة الآن بكلمة السر الجديدة.';
    }catch(err){m.className='msg err';m.textContent='تعذّر الحفظ: '+((err&&(err.message||err.code))||'خطأ غير معروف');}
  }
});

/* ---------- capabilities (optional) ---------- */
(async function(){
  try{
    if(!window.claude||!claude.use)return;
    const u=await claude.use('user');
    if(u&&(await u.canEdit())){S.canEdit=true;const b=$('#tBox');if(b)b.hidden=false;else if(S.unlocked)render();}
  }catch(e){}
})();
render();
})();
</script>

</body></html>
